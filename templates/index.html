<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PQC Encryption (AES Fallback)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .copy-box {
            background-color: #f8f9fa;
            padding: 0.5rem;
            border-radius: 5px;
            font-family: monospace;
            word-break: break-all;
            cursor: pointer;
        }
        .form-section {
            margin-bottom: 2rem;
        }
        .heading {
            text-shadow: 0 1px 1px #ccc;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="text-center mb-4 heading">Post-Quantum Crypto Web App (AES Fallback)</h2>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <div class="form-section">
        <form method="POST" action="/generate_key">
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">🔐 Generate AES Key</button>
            </div>
        </form>

        {% if key_b64 %}
        <div class="mt-3">
            <label><strong>Generated Key:</strong></label>
            <div class="copy-box" onclick="copyText(this)">{{ key_b64 }}</div>

            <label class="mt-2"><strong>Generated IV:</strong></label>
            <div class="copy-box" onclick="copyText(this)">{{ iv_b64 }}</div>
        </div>
        {% endif %}
    </div>

    <div class="form-section">
        <form method="POST" action="/encrypt">
            <h5>🛡️ Encrypt a Message</h5>
            <div class="form-group mb-2">
                <input type="text" name="message" class="form-control" placeholder="Enter your message..." required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-success">Encrypt</button>
            </div>
        </form>

        {% if encrypted %}
        <div class="mt-3">
            <label><strong>Encrypted Message (Base64):</strong></label>
            <div class="copy-box" onclick="copyText(this)">{{ encrypted }}</div>
        </div>
        {% endif %}
    </div>

    <div class="form-section">
        <form method="POST" action="/decrypt">
            <h5>🔓 Decrypt a Message</h5>
            <div class="form-group mb-2">
                <input type="text" name="ciphertext" class="form-control" placeholder="Paste ciphertext..." required>
            </div>
            <div class="form-group mb-2">
                <input type="text" name="key" class="form-control" placeholder="Paste AES key (Base64)..." required>
            </div>
            <div class="form-group mb-3">
                <input type="text" name="iv" class="form-control" placeholder="Paste IV (Base64)..." required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-danger">Decrypt</button>
            </div>
        </form>

        {% if decrypted %}
        <div class="mt-3">
            <label><strong>Decrypted Message:</strong></label>
            <div class="copy-box" onclick="copyText(this)">{{ decrypted }}</div>
        </div>
        {% endif %}
    </div>
</div>

<script>
    function copyText(el) {
        navigator.clipboard.writeText(el.textContent);
        el.style.backgroundColor = "#d1e7dd";  // light green on copy
        setTimeout(() => {
            el.style.backgroundColor = "#f8f9fa";
        }, 600);
    }
    
</script>
</body>
</html>
